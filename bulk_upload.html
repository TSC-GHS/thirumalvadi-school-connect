<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bulk Upload | School Connect TN</title>

<link rel="stylesheet" href="css/bulk_upload.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- =========================
HEADER
========================= -->

<header class="header">

<div class="header-left">

<h1>

<i class="fa-solid fa-file-arrow-up"></i>

Bulk Upload

</h1>

<p>

School Connect TN - Admin Panel

</p>

</div>

<div class="header-right">

<button
class="homeBtn"
onclick="location.href='admin_dashboard_v3.html'">

🏠 Dashboard

</button>

</div>

</header>

<!-- =========================
MAIN
========================= -->

<div class="container">
<!-- =========================
UPLOAD CARD
========================= -->

<section class="card">

<h2>📤 Bulk Upload</h2>

<select id="uploadType">

<option value="">Select Upload Type</option>

<option value="students">👨‍🎓 Students</option>

<option value="teachers">👨‍🏫 Teachers</option>

<option value="parents">👨‍👩‍👧 Parents</option>

<option value="attendance">📅 Attendance</option>

<option value="marks">📝 Marks</option>

<option value="homework">📚 Homework</option>

<option value="notices">📢 Notices</option>

<option value="calendar">🗓 Calendar</option>

<option value="timetable">🕒 Timetable</option>

</select>

<br><br>

<button
id="downloadTemplateBtn"
class="downloadBtn">

⬇ Download CSV Template

</button>

<br><br>

<input
type="file"
id="csvFile"
accept=".csv">

<p id="fileName">

No file selected

</p>

<br>

<button
id="uploadBtn"
class="uploadBtn">

📤 Upload CSV

</button>

</section>
<!-- =========================
PROGRESS
========================= -->

<section class="card">

<h2>

📊 Upload Progress

</h2>

<div class="progress">

<div
id="progressBar"
class="progress-bar">

0%

</div>

</div>

<p id="status">

Waiting for upload...

</p>

</section>

<!-- =========================
SUMMARY
========================= -->

<section class="card">

<h2>

📈 Import Summary

</h2>

<div class="summary-grid">

<div class="summary-box">

<h3 id="totalRecords">

0

</h3>

<p>Total</p>

</div>

<div class="summary-box success">

<h3 id="successRecords">

0

</h3>

<p>Imported</p>

</div>

<div class="summary-box warning">

<h3 id="updatedRecords">

0

</h3>

<p>Updated</p>

</div>

<div class="summary-box danger">

<h3 id="failedRecords">

0

</h3>

<p>Failed</p>

</div>
<div style="text-align:center;margin-top:15px;">

<button
id="downloadErrorBtn"
class="downloadBtn">

⬇ Download Error Report

</button>

</div>
</div>

</section>

<!-- =========================
UPLOAD HISTORY
========================= -->

<section class="card">

<h2>

📜 Upload History

</h2>

<table>

<thead>

<tr>

<th>Date</th>

<th>Module</th>

<th>Records</th>

<th>Status</th>

</tr>

</thead>

<tbody id="historyTable">

<tr>

<td colspan="4">

No Upload History

</td>

</tr>

</tbody>

</table>

</section>

<!-- =========================
DOWNLOAD TEMPLATE
========================= -->
</section>

</div>

<script
type="module"
src="js/bulk_upload.js">

</script>

</body>

</html>
