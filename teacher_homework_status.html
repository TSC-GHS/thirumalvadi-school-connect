<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Homework Status</title>

<link rel="stylesheet" href="css/teacher.css">

</head>

<body>

<div class="header">

<h2>📚 Homework Status</h2>

</div>

<div class="container">

<div class="dashboard">

<div class="dashCard blue">

<h3 id="totalHomework">0</h3>

<p>Total Homework</p>

</div>

<div class="dashCard green" id="completedCard">

<h3 id="completedCount">0</h3>

<p>Completed</p>

</div>

<div class="dashCard red" id="pendingCard">

<h3 id="pendingCount">0</h3>

<p>Pending</p>

</div>

</div>

<div id="completedPopup" class="popup">

<div class="popupBox">

<h2>✅ Completed Students</h2>

<div id="completedList"></div>

<button id="closeCompleted">

Close

</button>

</div>

</div>

<div id="pendingPopup" class="popup">

<div class="popupBox">

<h2>⏳ Pending Students</h2>

<div id="pendingList"></div>

<button id="closePending">

Close

</button>

</div>

</div>

<br>

<a href="teacher.html" class="menuCard">

🏠 Back to Dashboard

</a>

</div>

<script type="module" src="js/teacher_homework_status.js"></script>

</body>

</html>
