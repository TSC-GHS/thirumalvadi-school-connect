<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Report Card | School Connect TN</title>

<link rel="stylesheet" href="css/report_card.css">

</head>

<body>

<div class="header">

📄 Student Report Card

</div>

<div class="container">

<div class="card">

<h2>Student Details</h2>

<input
type="text"
id="emis"
placeholder="Enter EMIS Number">

<button
onclick="loadReport()">

🔍 Load Report

</button>

<div class="student-details">

<img
id="studentPhoto"
src="images/student.png"
alt="Student Photo">

<p><b>Name :</b> <span id="name">-</span></p>

<p><b>EMIS :</b> <span id="emisNo">-</span></p>

<p><b>Class :</b> <span id="class">-</span></p>

<p><b>Section :</b> <span id="section">-</span></p>

</div>

</div>

<div class="card">

<h2>Exam Results</h2>

<table>

<thead>

<tr>

<th>Subject / Exam</th>

<th>Marks</th>

</tr>

</thead>

<tbody id="reportTable">

<tr>

<td colspan="2">

No Report Available

</td>

</tr>

</tbody>

</table>

</div>

<button
class="back-btn"
onclick="history.back()">

🏠 Back

</button>

</div>

<script type="module" src="js/report_card.js"></script>

</body>

</html>
