<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

School Connect TN

</title>

<link rel="stylesheet"
href="css/login.css">

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="logo-section">

<img
src="assets/logo/login-logo.png"
class="school-logo"
alt="School Connect TN Logo">

<h1>School Connect TN</h1>

<p class="subtitle">
Government School Management System
</p>

<div class="versionBadge">
Version 2.0 Professional
</div>

</div>

<div class="form-group">
<div class="welcomeBox">

<h2>

👋 Welcome Back

</h2>

<p>

Please login to continue.

</p>

</div>
<label>

School

</label>

<select id="school">

<option>

திருமல்வாடி அரசு உயர்நிலைப்பள்ளி

</option>

</select>

</div>

<div class="form-group">

<label>

Role

</label>

<select id="role">
<option value="Student">

🎓 Student

</option>

<option value="Parent">

👨‍👩‍👧 Parent

</option>

<option value="Teacher">

👨‍🏫 Teacher

</option>

<option value="Headmaster">

👨‍💼 Headmaster

</option>

<option value="Admin">

⚙️ Admin

</option>

</select>

</div>

<div class="form-group">

<label>

Username / EMIS

</label>

<input
type="text"
id="email"
placeholder="Enter EMIS Number or Username">

</div>

<div class="form-group">

<label>

Password

</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter Password">

<button
type="button"
id="togglePassword"
aria-label="Show Password">

👁️

</button>

</div>

</div>

<div class="remember">

<input
type="checkbox"
id="remember">

<label for="remember">

Remember Me

</label>

</div>

<div class="loginLinks">

<a href="#">

Forgot Password?

</a>

</div>
<button
class="login-btn"
onclick="loginUser()">

🔐 Secure Login

</button>

<p id="msg"></p>
  <div class="loginFeatures">

<div>☁ Cloud Sync</div>

<div>🔒 Secure Login</div>

<div>📱 Mobile Ready</div>

</div>
<div class="footer-section">

<p class="version">

Version 2.0 Professional

</p>

<p class="powered">

Powered by

<b>VTOOS Software Solution</b>

</p>

</div>

</div>

</div>

<script type="module" src="js/login.js"></script>

<script>

const togglePassword =
document.getElementById("togglePassword");

const password =
document.getElementById("password");

togglePassword.addEventListener("click",()=>{

if(password.type==="password"){

password.type="text";

togglePassword.innerHTML="🙈";

}else{

password.type="password";

togglePassword.innerHTML="👁️";

}

});

</script>

</body>

</html>
