<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Database Sync</title>

<link rel="stylesheet" href="css/database_sync.css">

</head>

<body>

<header class="header">

    <div>
        <h2>⚙️ Database Sync & Migration</h2>
        <p>School Connect TN</p>
    </div>

    <button onclick="location.href='admin_dashboard.html'">
        🏠 Dashboard
    </button>

</header>

<div class="container">

    <!-- Summary -->

    <section class="summary">

        <div class="card">
            <h1 id="studentCount">0</h1>
            <p>Students</p>
        </div>

        <div class="card">
            <h1 id="teacherCount">0</h1>
            <p>Teachers</p>
        </div>

        <div class="card">
            <h1 id="parentCount">0</h1>
            <p>Parent Accounts</p>
        </div>

        <div class="card">
            <h1 id="studentUserCount">0</h1>
            <p>Student Accounts</p>
        </div>

    </section>

    <!-- Actions -->

    <section class="actions">

        <button onclick="syncStudents()">
            👨‍🎓 Sync Students
        </button>

        <button onclick="generateParentAccounts()">
            👨‍👩‍👧 Generate Parent Accounts
        </button>

        <button onclick="generateStudentAccounts()">
            🎓 Generate Student Accounts
        </button>

        <button onclick="generateTeacherIds()">
            👨‍🏫 Generate Teacher IDs
        </button>

        <button onclick="generateRegisterNumbers()">
            🆔 Generate Register Numbers
        </button>

        <button onclick="rebuildDashboard()">
            📊 Rebuild Dashboard
        </button>

        <button class="runBtn" onclick="runCompleteMigration()">
            🚀 Run Complete Migration
        </button>

    </section>

    <!-- Progress -->

    <section class="progressCard">

        <h3>Migration Progress</h3>

        <progress
            id="progressBar"
            value="0"
            max="100">
        </progress>

        <p id="progressText">

            Waiting...

        </p>

    </section>

    <!-- Report -->

    <section class="report">

        <h3>Migration Report</h3>

        <div id="report">

            Ready...

        </div>

    </section>

</div>

<script type="module" src="js/database_sync.js"></script>

</body>
</html>
